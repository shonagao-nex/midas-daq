<!doctype html>
<html class="mcss" lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Run Summary</title>
    <link rel="stylesheet" href="midas.css">
    <link rel="stylesheet" href="daq.css">
    <link rel="stylesheet" href="run-summary.css">
    <script src="midas.js"></script>
    <script src="mhttpd.js"></script>
    <script src="run-summary.js" defer></script>
  </head>

  <body class="mcss" onload="initializeRunSummary()">
    <div id="mheader"></div>
    <div id="msidenav"></div>
    <main id="mmain" class="dashboard-main summary-main">

      <section class="dashboard-section" aria-labelledby="summary-heading">
        <h1 id="summary-heading" class="section-heading">Run Summary</h1>
        <div class="summary-toolbar">
          <p class="summary-intro">Completed and incomplete runs from the MIDAS JSON Runlog. Newest runs appear first.</p>
          <button id="export-csv" type="button">Export CSV</button>
        </div>
        <div id="summary-error" class="connection-error" role="alert" hidden></div>
        <p id="export-status" class="export-status" role="status" hidden></p>
        <div class="summary-table-scroll">
          <table class="summary-table">
            <thead>
              <tr>
                <th>Run</th>
                <th>Experiment</th>
                <th>Type</th>
                <th>Start</th>
                <th>Stop</th>
                <th>Duration</th>
                <th>VME</th>
                <th>EASI</th>
                <th>HUL</th>
                <th>Slip</th>
                <th>Status</th>
                <th>Comment</th>
                <th>Scaler</th>
              </tr>
            </thead>
            <tbody id="run-summary-rows">
              <tr>
                <td colspan="13">Loading Runlogs…</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="summary-footer">
          <span id="summary-count" role="status"></span>
          <button id="older-runs" type="button" disabled>Older runs</button>
        </div>
      </section>

      <nav class="page-links">
        <a href="daq.html">DAQ dashboard</a>
        <a href="/?cmd=Messages">MIDAS Messages</a>
      </nav>
    </main>

    <dialog id="run-edit-dialog" class="run-edit-dialog" aria-labelledby="run-edit-title">
      <form id="run-edit-form">
        <h2 id="run-edit-title">Edit run metadata</h2>
        <p class="run-edit-intro">Run <strong id="run-edit-number"></strong></p>
        <label for="run-edit-experiment">Experiment</label>
        <input id="run-edit-experiment" type="text" maxlength="255" autocomplete="off">
        <label for="run-edit-type">Type</label>
        <select id="run-edit-type">
          <option value="">Select Type</option>
          <option value="Data">Data</option>
          <option value="Clock">Clock</option>
          <option value="Cosmic">Cosmic</option>
          <option value="Test">Test</option>
        </select>
        <label for="run-edit-comment">Comment</label>
        <textarea id="run-edit-comment" rows="5" maxlength="1024"></textarea>
        <p id="run-edit-message" class="run-edit-message" role="alert" hidden></p>
        <div class="run-edit-actions">
          <button id="run-edit-cancel" type="button">Cancel</button>
          <button id="run-edit-save" type="submit">Save</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
